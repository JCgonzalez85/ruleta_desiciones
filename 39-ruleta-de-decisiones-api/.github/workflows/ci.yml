name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run AI containment hook tests
        run: npm run test:guard

      - name: Run quality checks (typecheck + lint + format:check + test coverage)
        run: npm run check

      - name: Build production bundle
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high
